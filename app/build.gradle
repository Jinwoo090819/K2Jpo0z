plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orbinexia.instafinder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.orbinexia.instafinder'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2.0-beta1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
